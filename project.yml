name: MK-IOS
options:
  bundleIdPrefix: com.mkios
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_MODULE_NAME: MKIOS
targets:
  MK-IOS:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mkios.app
        PRODUCT_MODULE_NAME: MKIOS
        MARKETING_VERSION: 20.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MK-IOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
